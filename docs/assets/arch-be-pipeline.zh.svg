<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="be-zh-title be-zh-desc">
<title id="be-zh-title">Forgia Canonical 方块实体执行流水线</title>
<desc id="be-zh-desc">展示 CanonicalBlockEntityCoordinator 如何按单调 sequence 顺序处理方块实体：O(1) 增量前缀独立性判定、租约获取与 preWake 重叠、直访线程字段执行、物理 join 规范提交，以及遇到未知模组时触发 Fail-Closed 串行围栏并重审后缀。</desc>
<defs>
  <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#aeb4ad" stroke-width=".55" opacity=".32"/>
  </pattern>
  <marker id="a-orange" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#b94b2c" stroke-width="1.3"/>
  </marker>
  <marker id="a-green" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#4d6d43" stroke-width="1.3"/>
  </marker>
</defs>

<rect width="920" height="310" fill="#e9e8e1"/>
<rect width="920" height="310" fill="url(#grid2)"/>

<g font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#626d70">
  <text x="24" y="24">CANONICAL 方块实体流水线 // 热路径优化后 (main @ 7efd88d)</text>
  <text x="896" y="24" text-anchor="end">C6 至多执行一次契约</text>
</g>
<line x1="24" y1="34" x2="896" y2="34" stroke="#c5c8bf" stroke-width="1"/>

<!-- Stage 1 -->
<rect x="24" y="52" width="160" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="36" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">01 // CURSOR</text>
<text x="36" y="92" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Lookahead 与</text>
<text x="36" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">前缀证明</text>
<text x="36" y="128" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• O(1) 增量独立性</text>
<text x="36" y="143" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#626d70">  PrefixIndependence</text>
<text x="36" y="158" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 复用前缀集合</text>

<line x1="184" y1="113" x2="204" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 2 -->
<rect x="206" y="52" width="162" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="218" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">02 // LEASE + WAKE</text>
<text x="218" y="92" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">租约获取与</text>
<text x="218" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">新鲜复核</text>
<text x="218" y="128" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#626d70">• workerPool.preWake()</text>
<text x="218" y="143" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 邮箱投递 + 新鲜审计</text>
<text x="218" y="158" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 直查 SharedReads</text>

<line x1="368" y1="113" x2="388" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 3 -->
<rect x="390" y="52" width="168" height="122" rx="3" fill="#202628" stroke="#b94b2c" stroke-width="1.2"/>
<text x="402" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">03 // WORKERS</text>
<text x="402" y="92" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">线程池一次性</text>
<text x="402" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">执行前缀</text>
<text x="402" y="128" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#d2d2c9">• RegionWorkerThread</text>
<text x="402" y="143" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#d2d2c9">  直访 Scope 字段</text>
<text x="402" y="158" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#d2d2c9">• 工作窃取分组派发</text>

<line x1="558" y1="113" x2="578" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 4 -->
<rect x="580" y="52" width="154" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="592" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">04 // JOIN</text>
<text x="592" y="92" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">物理 Join 与</text>
<text x="592" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">规范提交</text>
<text x="592" y="128" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 保持原版因果顺序</text>
<text x="592" y="143" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 提交通知与延迟效果</text>
<text x="592" y="158" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#626d70">• 推进单调 cursor</text>

<line x1="734" y1="113" x2="754" y2="113" stroke="#4d6d43" stroke-width="1.4" marker-end="url(#a-green)"/>

<!-- Stage 5: Serial Fence -->
<rect x="756" y="52" width="140" height="122" rx="3" fill="#ebf0e7" stroke="#718d62" stroke-width="1.2"/>
<text x="768" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#3a5232">05 // FENCE</text>
<text x="768" y="92" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">串行围栏与</text>
<text x="768" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#202628">后缀重审</text>
<text x="768" y="128" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#495356">• 未知模组 / Mixin</text>
<text x="768" y="143" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#495356">• 主线程完整执行一次</text>
<text x="768" y="158" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10" fill="#495356">• 重查剩余后缀</text>

<!-- Feedback loop arrow from Stage 5 back to Stage 1 -->
<path d="M826 174V200H104V176" fill="none" stroke="#4d6d43" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#a-green)"/>
<rect x="340" y="189" width="240" height="22" fill="#e9e8e1"/>
<text x="460" y="204" text-anchor="middle" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#3a5232">每次围栏后均对后缀重新进行新鲜证明</text>

<!-- Optimization Impact Strip -->
<rect x="24" y="228" width="872" height="62" rx="3" fill="#f3f2ed" stroke="#c5c8bf"/>
<text x="40" y="248" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227" font-weight="600">实测热路径优化效果（64 燃烧熔炉 + 开启 BLOCK ENTITY RESOURCES）</text>
<g font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#202628">
  <text x="40" y="272"><tspan font-weight="600">MSPT 均值：</tspan>10.36 ms (.98) → 2.24 ms（优化前）→ <tspan font-weight="700" fill="#a84227">1.34 ms</tspan>（较基线快 1.67×）</text>
  <text x="530" y="272"><tspan font-weight="600">分配速率：</tspan>253 → 18.68 → <tspan font-weight="700" fill="#a84227">5.18 MiB/s</tspan>（降至 1/3.61）</text>
</g>
</svg>
