<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Stock Forge/NeoForge vs Forgia Architecture Comparison</title>
<desc id="arch-desc">Left side shows Stock Forge/NeoForge running all server tick slices sequentially on a single Server thread. Right side shows Forgia alternating GLOBAL and REGION phases across parallel RegionWorkerThreads with explicit ownership leases, canonical block-entity prefixes, and fail-closed Serial Fence fallback.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#aeb4ad" stroke-width=".6" opacity=".35"/>
  </pattern>
  <marker id="arr-dark" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#495356" stroke-width="1.2"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#b94b2c" stroke-width="1.3"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#4d6d43" stroke-width="1.2"/>
  </marker>
</defs>

<!-- Background -->
<rect width="920" height="500" fill="#e9e8e1"/>
<rect width="920" height="500" fill="url(#grid)"/>

<!-- Header Bar -->
<g font-family="SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#626d70">
  <text x="24" y="26">ARCHITECTURE BLUEPRINT // 01</text>
  <text x="896" y="26" text-anchor="end">NEOFORGE 1.21.1 ECOSYSTEM</text>
</g>
<line x1="24" y1="36" x2="896" y2="36" stroke="#c5c8bf" stroke-width="1"/>

<!-- LEFT PANEL: STOCK FORGE / NEOFORGE -->
<rect x="24" y="50" width="328" height="426" rx="4" fill="#f3f2ed" stroke="#b8bdb5" stroke-width="1.2"/>
<rect x="24" y="50" width="328" height="42" rx="4" fill="#2b3336"/>
<rect x="24" y="76" width="328" height="16" fill="#2b3336"/>
<text x="40" y="69" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a4adaa">BASELINE MODEL</text>
<text x="40" y="85" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#f3f2ed">Stock Forge / NeoForge</text>
<rect x="252" y="61" width="86" height="20" rx="2" fill="#414b4f"/>
<text x="295" y="75" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#e8e8e1">1 THREAD</text>

<!-- Single Server Thread Spine -->
<text x="188" y="114" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#495356">SERVER THREAD (SERIAL LOOP)</text>

<g font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="550" fill="#202628">
  <rect x="52" y="124" width="272" height="34" rx="3" fill="#e9e8e1" stroke="#aeb4ad"/>
  <text x="188" y="145" text-anchor="middle">1. Time · Weather · WorldBorder</text>

  <line x1="188" y1="158" x2="188" y2="170" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>

  <rect x="52" y="172" width="272" height="34" rx="3" fill="#e9e8e1" stroke="#aeb4ad"/>
  <text x="188" y="193" text-anchor="middle">2. Chunk Ticks &amp; Natural Spawning</text>

  <line x1="188" y1="206" x2="188" y2="218" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>

  <rect x="52" y="220" width="272" height="34" rx="3" fill="#e9e8e1" stroke="#aeb4ad"/>
  <text x="188" y="241" text-anchor="middle">3. All Entity Ticks (Sequential)</text>

  <line x1="188" y1="254" x2="188" y2="266" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>

  <rect x="52" y="268" width="272" height="34" rx="3" fill="#e9e8e1" stroke="#aeb4ad"/>
  <text x="188" y="289" text-anchor="middle">4. All Block Entities (Sequential)</text>

  <line x1="188" y1="302" x2="188" y2="314" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>

  <rect x="52" y="316" width="272" height="34" rx="3" fill="#e9e8e1" stroke="#aeb4ad"/>
  <text x="188" y="337" text-anchor="middle">5. Scheduled Ticks · Players · Net</text>
</g>

<!-- Stock Bottleneck Box -->
<rect x="44" y="368" width="288" height="92" rx="3" fill="#e5e1d8" stroke="#c7b9a5" stroke-dasharray="4 3"/>
<text x="60" y="388" font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#8f3923" font-weight="600">CONCURRENCY CHARACTERISTICS</text>
<g font-family="Inter,Arial,sans-serif" font-size="11" fill="#495356">
  <text x="60" y="408">• Implicit shared mutable world state</text>
  <text x="60" y="426">• 100% mod-callback compatible by default</text>
  <text x="60" y="444">• Single-core ceiling: all slices share 50 ms</text>
</g>

<!-- CENTER DIVIDER -->
<line x1="370" y1="54" x2="370" y2="472" stroke="#c5c8bf" stroke-width="1" stroke-dasharray="5 5"/>
<rect x="353" y="246" width="34" height="24" rx="12" fill="#202628"/>
<text x="370" y="262" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" fill="#ed7950">VS</text>

<!-- RIGHT PANEL: FORGIA REGIONIZED CORE -->
<rect x="388" y="50" width="508" height="426" rx="4" fill="#f3f2ed" stroke="#b94b2c" stroke-width="1.4"/>
<rect x="388" y="50" width="508" height="42" rx="4" fill="#202628"/>
<rect x="388" y="76" width="508" height="16" fill="#202628"/>
<text x="404" y="69" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">REGIONIZED RUNTIME</text>
<text x="404" y="85" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#f3f2ed">Forgia Core (NeoForge 1.21.1)</text>
<rect x="752" y="61" width="128" height="20" rx="2" fill="#a84227"/>
<text x="816" y="75" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#fff">GLOBAL ↔ REGION</text>

<!-- Server Coordinator Top -->
<rect x="408" y="106" width="468" height="58" rx="3" fill="#e9e8e1" stroke="#929b96"/>
<text x="422" y="124" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227" font-weight="600">GLOBAL PHASE // SERVER COORDINATOR</text>
<text x="422" y="142" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#202628">RegionThreadingEngine + CanonicalBlockEntityCoordinator</text>
<text x="422" y="156" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#626d70">Leases (Fixed N×N / Dynamic Islands) · preWake · Freshness &amp; Claims Proof</text>

<!-- Fan-out arrows to workers + Serial Fence -->
<path d="M510 164V180H474V194" fill="none" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#arr-orange)"/>
<path d="M642 164V194" fill="none" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#arr-orange)"/>
<path d="M774 164V180H808V194" fill="none" stroke="#4d6d43" stroke-width="1.4" marker-end="url(#arr-green)"/>

<!-- Worker Columns -->
<g>
  <!-- Worker 1 -->
  <rect x="408" y="196" width="142" height="148" rx="3" fill="#fff" stroke="#929b96"/>
  <rect x="408" y="196" width="142" height="24" rx="3" fill="#202628"/>
  <text x="479" y="212" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">RegionWorkerThread 1</text>
  <text x="418" y="236" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Region A Lease</text>
  <text x="418" y="254" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Entities &amp; Spawning</text>
  <text x="418" y="270" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Random Chunk Ticks</text>
  <text x="418" y="286" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Proven BE Prefixes</text>
  <rect x="418" y="298" width="122" height="36" rx="2" fill="#f3f2ed" stroke="#d2d2c9"/>
  <text x="479" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#495356">DIRECT THREAD FIELDS</text>
  <text x="479" y="326" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#a84227">Lease + Scope Guard</text>

  <!-- Worker 2 -->
  <rect x="562" y="196" width="154" height="148" rx="3" fill="#fff" stroke="#929b96"/>
  <rect x="562" y="196" width="154" height="24" rx="3" fill="#202628"/>
  <text x="639" y="212" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">RegionWorkerThread 2..N</text>
  <text x="572" y="236" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Region B..K Leases</text>
  <text x="572" y="254" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Work-Stealing Deques</text>
  <text x="572" y="270" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Packed Leases (≤16)</text>
  <text x="572" y="286" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Seqlock/Snapshot Read</text>
  <rect x="572" y="298" width="134" height="36" rx="2" fill="#f3f2ed" stroke="#d2d2c9"/>
  <text x="639" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#495356">AT-MOST-ONCE BODY</text>
  <text x="639" y="326" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#a84227">Zero Replay on Fault</text>

  <!-- Serial Fence Column -->
  <rect x="728" y="196" width="148" height="148" rx="3" fill="#f7f8f4" stroke="#718d62" stroke-width="1.2"/>
  <rect x="728" y="196" width="148" height="24" rx="3" fill="#4d6d43"/>
  <text x="802" y="212" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#fff">FAIL-CLOSED FENCE</text>
  <text x="738" y="236" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Server Serial Path</text>
  <text x="738" y="254" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Unknown Mod Callbacks</text>
  <text x="738" y="270" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Create / Contraptions</text>
  <text x="738" y="286" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Players &amp; Global State</text>
  <rect x="738" y="298" width="128" height="36" rx="2" fill="#ebf0e7" stroke="#9db292"/>
  <text x="802" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#3a5232">PHYSICAL JOIN FIRST</text>
  <text x="802" y="326" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#3a5232">Re-audit Suffix After</text>
</g>

<!-- Join arrows to Commit -->
<path d="M479 344V362H642V374" fill="none" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
<path d="M639 344V374" fill="none" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
<path d="M802 344V362H642" fill="none" stroke="#4d6d43" stroke-width="1.3"/>

<!-- Commit & Coordination Footer -->
<rect x="408" y="376" width="468" height="84" rx="3" fill="#202628"/>
<text x="424" y="396" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">BARRIER JOIN &amp; CANONICAL COMMIT // GLOBAL BOUNDARY</text>
<g font-family="Inter,Arial,sans-serif" font-size="11" fill="#e8e8e1">
  <text x="424" y="416">• Deferred Cross-Region Writes &amp; Border Redstone Fixpoint (Same-Tick)</text>
  <text x="424" y="434">• Entity Transfer Journal · Block Entity Two-Owner Operations · Mailbox Drain</text>
  <text x="424" y="452" fill="#a4adaa">Default-OFF switches · Physical thread join on shutdown · Real-Level GC certified</text>
</g>
</svg>
