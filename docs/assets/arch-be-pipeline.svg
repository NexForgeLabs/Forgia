<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="be-title be-desc">
<title id="be-title">Forgia Canonical Block Entity Execution Pipeline</title>
<desc id="be-desc">Shows how CanonicalBlockEntityCoordinator processes block entities in monotonic sequence order with O(1) incremental prefix independence, region lease + preWake overlap, worker execution under direct thread scopes, physical join commit, and fail-closed Serial Fence fallback.</desc>
<defs>
  <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#aeb4ad" stroke-width=".55" opacity=".32"/>
  </pattern>
  <marker id="a-orange" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#b94b2c" stroke-width="1.3"/>
  </marker>
  <marker id="a-green" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#4d6d43" stroke-width="1.3"/>
  </marker>
</defs>

<rect width="920" height="310" fill="#e9e8e1"/>
<rect width="920" height="310" fill="url(#grid2)"/>

<g font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#626d70">
  <text x="24" y="24">CANONICAL BLOCK ENTITY PIPELINE // OPTIMIZED HOT PATH (main @ 7efd88d)</text>
  <text x="896" y="24" text-anchor="end">C6 AT-MOST-ONCE CONTRACT</text>
</g>
<line x1="24" y1="34" x2="896" y2="34" stroke="#c5c8bf" stroke-width="1"/>

<!-- Stage 1 -->
<rect x="24" y="52" width="160" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="36" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">01 // CURSOR</text>
<text x="36" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Lookahead &amp;</text>
<text x="36" y="108" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Prefix Proof</text>
<text x="36" y="128" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• O(1) incremental</text>
<text x="36" y="143" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">  PrefixIndependence</text>
<text x="36" y="158" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Reused prefix list</text>

<line x1="184" y1="113" x2="204" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 2 -->
<rect x="206" y="52" width="162" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="218" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">02 // LEASE + WAKE</text>
<text x="218" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Acquire &amp;</text>
<text x="218" y="108" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Revalidate</text>
<text x="218" y="128" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• workerPool.preWake()</text>
<text x="218" y="143" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Mailbox + fresh audit</text>
<text x="218" y="158" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Direct SharedReads</text>

<line x1="368" y1="113" x2="388" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 3 -->
<rect x="390" y="52" width="168" height="122" rx="3" fill="#202628" stroke="#b94b2c" stroke-width="1.2"/>
<text x="402" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">03 // WORKERS</text>
<text x="402" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">Execute Prefix</text>
<text x="402" y="108" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">Once on Pool</text>
<text x="402" y="128" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d2d2c9">• RegionWorkerThread</text>
<text x="402" y="143" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d2d2c9">  direct Scope fields</text>
<text x="402" y="158" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d2d2c9">• Work-stealing lanes</text>

<line x1="558" y1="113" x2="578" y2="113" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#a-orange)"/>

<!-- Stage 4 -->
<rect x="580" y="52" width="154" height="122" rx="3" fill="#f3f2ed" stroke="#929b96"/>
<text x="592" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227">04 // JOIN</text>
<text x="592" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Physical Join</text>
<text x="592" y="108" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">&amp; Commit</text>
<text x="592" y="128" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Canonical order</text>
<text x="592" y="143" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Notifications &amp; ops</text>
<text x="592" y="158" font-family="Inter,Arial,sans-serif" font-size="10" fill="#626d70">• Advance cursor</text>

<line x1="734" y1="113" x2="754" y2="113" stroke="#4d6d43" stroke-width="1.4" marker-end="url(#a-green)"/>

<!-- Stage 5: Serial Fence -->
<rect x="756" y="52" width="140" height="122" rx="3" fill="#ebf0e7" stroke="#718d62" stroke-width="1.2"/>
<text x="768" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#3a5232">05 // FENCE</text>
<text x="768" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">Serial Fence</text>
<text x="768" y="108" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#202628">&amp; Re-audit</text>
<text x="768" y="128" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Unknown / Mixin</text>
<text x="768" y="143" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Runs once on server</text>
<text x="768" y="158" font-family="Inter,Arial,sans-serif" font-size="10" fill="#495356">• Re-prove suffix</text>

<!-- Feedback loop arrow from Stage 5 back to Stage 1 -->
<path d="M826 174V200H104V176" fill="none" stroke="#4d6d43" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#a-green)"/>
<rect x="330" y="189" width="260" height="22" fill="#e9e8e1"/>
<text x="460" y="204" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#3a5232">SUFFIX RE-PROVES FRESH AFTER EVERY FENCE</text>

<!-- Optimization Impact Strip -->
<rect x="24" y="228" width="872" height="62" rx="3" fill="#f3f2ed" stroke="#c5c8bf"/>
<text x="40" y="248" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a84227" font-weight="600">MEASURED BE HOT-PATH IMPACT (64 BURNING FURNACES + BLOCK ENTITY RESOURCES ENABLED)</text>
<g font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#202628">
  <text x="40" y="272"><tspan font-weight="600">MSPT Mean:</tspan> 10.36 ms (.98) → 2.24 ms (baseline) → <tspan font-weight="700" fill="#a84227">1.34 ms</tspan> (1.67× faster vs baseline)</text>
  <text x="546" y="272"><tspan font-weight="600">Alloc:</tspan> 253 → 18.68 → <tspan font-weight="700" fill="#a84227">5.18 MiB/s</tspan> (3.61× reduction)</text>
</g>
</svg>
