<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="rh-en-title rh-en-desc">
<title id="rh-en-title">Execution Hierarchy: Stock Forge vs. Forgia Region Parallelism</title>
<desc id="rh-en-desc">Left side shows Stock Forge executing the entire ServerLevel sequentially on one Server Thread queue. Right side shows Forgia splitting ServerLevel into independent leased Regions (Region A, B, C) executing in parallel on separate Workers, with deferred cross-region messaging and a barrier join / Serial Fence boundary.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#aeb4ad" stroke-width=".6" opacity=".35"/>
  </pattern>
  <marker id="arr-dark" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#495356" stroke-width="1.2"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#b94b2c" stroke-width="1.3"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto">
    <path d="M0 0L6 3L0 6" fill="none" stroke="#4d6d43" stroke-width="1.2"/>
  </marker>
</defs>

<rect width="920" height="470" fill="#e9e8e1"/>
<rect width="920" height="470" fill="url(#grid)"/>

<g font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#626d70">
  <text x="24" y="25">EXECUTION HIERARCHY // REGION PARALLELISM</text>
  <text x="896" y="25" text-anchor="end">STOCK FORGE VS. FORGIA</text>
</g>
<line x1="24" y1="35" x2="896" y2="35" stroke="#c5c8bf" stroke-width="1"/>

<!-- LEFT: STOCK FORGE -->
<rect x="24" y="48" width="320" height="398" rx="4" fill="#f3f2ed" stroke="#b8bdb5" stroke-width="1.2"/>
<rect x="24" y="48" width="320" height="38" rx="4" fill="#2b3336"/>
<rect x="24" y="72" width="320" height="14" fill="#2b3336"/>
<text x="40" y="72" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f3f2ed">Stock Forge (Global Serial)</text>
<rect x="256" y="57" width="76" height="20" rx="2" fill="#414b4f"/>
<text x="294" y="71" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#e8e8e1">1 CORE</text>

<rect x="74" y="104" width="220" height="44" rx="3" fill="#202628"/>
<text x="184" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">ServerLevel</text>
<text x="184" y="139" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a4adaa">(Entire World)</text>

<line x1="184" y1="148" x2="184" y2="170" stroke="#495356" stroke-width="1.4" marker-end="url(#arr-dark)"/>

<rect x="74" y="172" width="220" height="44" rx="3" fill="#202628"/>
<text x="184" y="191" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">ONE Server Thread</text>
<text x="184" y="207" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#a4adaa">(Shared Mutable Memory)</text>

<line x1="184" y1="216" x2="184" y2="238" stroke="#495356" stroke-width="1.4" marker-end="url(#arr-dark)"/>

<text x="184" y="254" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10" fill="#495356" font-weight="600">1 SINGLE FLAT QUEUE</text>
<rect x="44" y="264" width="280" height="36" rx="3" fill="#a84227"/>
<text x="184" y="286" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#fff">All Chunks · All Entities · All Block Entities</text>

<!-- Sequential 1->2->3->4 -->
<g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">
  <rect x="52" y="324" width="44" height="34" rx="3" fill="#a84227"/>
  <text x="74" y="346" text-anchor="middle">1</text>
  <line x1="96" y1="341" x2="114" y2="341" stroke="#495356" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <rect x="116" y="324" width="44" height="34" rx="3" fill="#a84227"/>
  <text x="138" y="346" text-anchor="middle">2</text>
  <line x1="160" y1="341" x2="178" y2="341" stroke="#495356" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <rect x="180" y="324" width="44" height="34" rx="3" fill="#a84227"/>
  <text x="202" y="346" text-anchor="middle">3</text>
  <line x1="224" y1="341" x2="242" y2="341" stroke="#495356" stroke-width="1.3" marker-end="url(#arr-dark)"/>

  <rect x="244" y="324" width="44" height="34" rx="3" fill="#a84227"/>
  <text x="266" y="346" text-anchor="middle">4</text>
</g>
<line x1="74" y1="300" x2="74" y2="322" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>
<line x1="138" y1="300" x2="138" y2="322" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>
<line x1="202" y1="300" x2="202" y2="322" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>
<line x1="266" y1="300" x2="266" y2="322" stroke="#495356" stroke-width="1.2" marker-end="url(#arr-dark)"/>

<rect x="44" y="376" width="280" height="52" rx="3" fill="#e5e1d8" stroke="#c7b9a5" stroke-dasharray="4 3"/>
<text x="184" y="397" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Sequential Execution on 1 CPU Core</text>
<text x="184" y="415" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#626d70">No region isolation · 50 ms shared budget</text>

<!-- VS DIVIDER -->
<line x1="364" y1="52" x2="364" y2="442" stroke="#c5c8bf" stroke-width="1" stroke-dasharray="5 5"/>
<rect x="348" y="236" width="32" height="24" rx="12" fill="#202628"/>
<text x="364" y="252" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="10" font-weight="700" fill="#ed7950">VS</text>

<!-- RIGHT: FORGIA -->
<rect x="384" y="48" width="512" height="398" rx="4" fill="#f3f2ed" stroke="#b94b2c" stroke-width="1.4"/>
<rect x="384" y="48" width="512" height="38" rx="4" fill="#202628"/>
<rect x="384" y="72" width="512" height="14" fill="#202628"/>
<text x="400" y="72" font-family="Inter,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#f3f2ed">Forgia (Independent Region Parallelism)</text>
<rect x="752" y="57" width="132" height="20" rx="2" fill="#a84227"/>
<text x="818" y="71" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#fff">MULTI-CORE</text>

<!-- Coordinator -->
<rect x="440" y="102" width="400" height="44" rx="3" fill="#202628"/>
<text x="640" y="121" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#f3f2ed">ServerLevel + RegionThreadingEngine</text>
<text x="640" y="137" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9.5" fill="#ed7950">(GLOBAL Coordinator · Spatial Leases)</text>

<!-- Branch arrows -->
<path d="M640 146V160M476 160H804M476 160V174M640 160V174M804 160V174" fill="none" stroke="#b94b2c" stroke-width="1.4" marker-end="url(#arr-orange)"/>

<!-- 3 Independent Region Columns -->
<!-- Region A -->
<g>
  <rect x="404" y="176" width="144" height="42" rx="3" fill="#202628"/>
  <text x="476" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#f3f2ed">Region A</text>
  <text x="476" y="209" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a4adaa">(3×3 Chunks)</text>
  <line x1="476" y1="218" x2="476" y2="240" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="404" y="242" width="144" height="42" rx="3" fill="#fff" stroke="#b94b2c" stroke-width="1.2"/>
  <text x="476" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Worker 1</text>
  <text x="476" y="275" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a84227">(Leased Ownership)</text>
  <line x1="476" y1="284" x2="476" y2="306" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="404" y="308" width="144" height="58" rx="3" fill="#e9e8e1" stroke="#929b96"/>
  <text x="476" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Entities</text>
  <text x="476" y="341" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Chunk Random Ticks</text>
  <text x="476" y="356" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#a84227">Proven Block Entities</text>
</g>

<!-- Region B -->
<g>
  <rect x="568" y="176" width="144" height="42" rx="3" fill="#202628"/>
  <text x="640" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#f3f2ed">Region B</text>
  <text x="640" y="209" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a4adaa">(3×3 Chunks)</text>
  <line x1="640" y1="218" x2="640" y2="240" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="568" y="242" width="144" height="42" rx="3" fill="#fff" stroke="#b94b2c" stroke-width="1.2"/>
  <text x="640" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Worker 2</text>
  <text x="640" y="275" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a84227">(Leased Ownership)</text>
  <line x1="640" y1="284" x2="640" y2="306" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="568" y="308" width="144" height="58" rx="3" fill="#e9e8e1" stroke="#929b96"/>
  <text x="640" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Entities</text>
  <text x="640" y="341" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Chunk Random Ticks</text>
  <text x="640" y="356" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#a84227">Proven Block Entities</text>
</g>

<!-- Region C -->
<g>
  <rect x="732" y="176" width="144" height="42" rx="3" fill="#202628"/>
  <text x="804" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#f3f2ed">Region C</text>
  <text x="804" y="209" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a4adaa">(3×3 Chunks)</text>
  <line x1="804" y1="218" x2="804" y2="240" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="732" y="242" width="144" height="42" rx="3" fill="#fff" stroke="#b94b2c" stroke-width="1.2"/>
  <text x="804" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#202628">Worker 3</text>
  <text x="804" y="275" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a84227">(Leased Ownership)</text>
  <line x1="804" y1="284" x2="804" y2="306" stroke="#b94b2c" stroke-width="1.3" marker-end="url(#arr-orange)"/>
  <rect x="732" y="308" width="144" height="58" rx="3" fill="#e9e8e1" stroke="#929b96"/>
  <text x="804" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Entities</text>
  <text x="804" y="341" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#202628">Chunk Random Ticks</text>
  <text x="804" y="356" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#a84227">Proven Block Entities</text>
</g>

<!-- Cross-Region Dashed Messaging -->
<path d="M548 263H566" fill="none" stroke="#b94b2c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-orange)"/>
<path d="M712 263H730" fill="none" stroke="#b94b2c" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-orange)"/>
<rect x="526" y="223" width="228" height="16" rx="2" fill="#f3f2ed"/>
<text x="640" y="234" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" font-weight="600" fill="#a84227">DEFERRED CROSS-REGION / MAILBOX</text>

<!-- Bottom Synchronization & Serial Fence Bar -->
<path d="M476 366V380H640M804 366V380H640V388" fill="none" stroke="#4d6d43" stroke-width="1.3" marker-end="url(#arr-green)"/>
<rect x="404" y="390" width="472" height="38" rx="3" fill="#202628" stroke="#4d6d43" stroke-width="1.2"/>
<text x="640" y="407" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#f3f2ed">Barrier Join · Border Fixpoint · Serial Fence (Unknown Mods)</text>
<text x="640" y="421" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" fill="#a4adaa">Physical join before commit · Zero replay · All switches default OFF</text>
</svg>
