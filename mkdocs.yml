site_name: Forgia
site_description: Regionized execution for the NeoForge ecosystem.
site_url: https://nexforgelabs.github.io/Forgia/
repo_url: https://github.com/NexForgeLabs/Forgia
repo_name: NexForgeLabs/Forgia
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/forgia-mark.svg
  favicon: assets/forgia-mark.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture:
      - Stock vs. Forgia (EN): architecture.en.md
      - 架构对比 (中文): architecture.zh.md
  - Benchmarks:
      - Performance (EN): benchmarks.en.md
      - 性能对比 (中文): benchmarks.zh.md
  - Project:
      - Overview: README.en.md
      - Engineering status: status.en.md
      - API: api/README.en.md
      - Adapters: adapters/README.en.md
      - Engine internals: modules/README.en.md
  - 中文:
      - 首页: index.zh.md
      - 项目文档: README.zh.md
      - 项目状态: status.zh.md
      - API: api/README.zh.md
      - 适配器: adapters/README.zh.md
      - 引擎内部: modules/README.zh.md
