site_name: Forgia
site_description: A regionized, multithreaded server core for NeoForge 1.21.1
site_url: https://nexforgelabs.github.io/Forgia/
repo_url: https://github.com/NexForgeLabs/Forgia
repo_name: NexForgeLabs/Forgia
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Documentation:
      - English: README.en.md
      - 简体中文: README.zh.md

