modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-2.1-only"

[[mods]]
modId = "forgia_cataclysm_compat"
version = "1.0.0"
displayName = "Forgia Cataclysm Compat"
description = '''
Thread-safe preloading and caching for Cataclysm's CMWorldData so NaturalSpawner and region workers can query
boss-defeat flags in parallel without touching DimensionDataStorage off the server thread.
'''

[[mixins]]
config = "forgia_cataclysm_compat.mixins.json"

[[dependencies.forgia_cataclysm_compat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.forgia_cataclysm_compat]]
modId = "cataclysm"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
