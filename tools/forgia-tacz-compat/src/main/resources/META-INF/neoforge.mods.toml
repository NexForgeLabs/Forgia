modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-2.1-only"

[[mods]]
modId = "forgia_tacz_compat"
version = "1.0.0"
displayName = "Forgia TaCZ Compat"
description = '''
Thread-safe synchronization and snapshotting for TaCZ's SyncedEntityData, SyncedEntityDataEvent, and DataHolder
so async region ticks and server-tick synchronization do not race on dirtyEntities or dataMap.
'''

[[mixins]]
config = "forgia_tacz_compat.mixins.json"

[[dependencies.forgia_tacz_compat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.forgia_tacz_compat]]
modId = "tacz"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
